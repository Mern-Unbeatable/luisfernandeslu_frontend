# Coolify/Nixpacks build config.
# The builder's npm (10.9.0) skips platform-specific optional dependencies
# (npm/cli#4828), so rolldown/lightningcss/tailwind-oxide native bindings for
# Linux never get installed and `vite build` crashes. After `npm ci` we fetch
# the exact binding tarballs straight from the npm registry.
[phases.install]
cmds = [
  "npm ci",
  "bash scripts/install-linux-natives.sh"
]
