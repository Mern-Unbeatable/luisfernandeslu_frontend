<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CONSTRUPRECO — the most complete building materials marketplace. Fast delivery and trusted suppliers."
    />
    <meta name="theme-color" content="#18181b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta name="robots" content="index, follow" />
    <!-- Installable only on panel roles; injected before React so Chrome can detect PWA -->
    <script>
      (function () {
        var panels = ['supplier', 'factory', 'transporter', 'affiliate', 'admin', 'moderator']
        var path = location.pathname.split('?')[0]
        var role = null
        for (var i = 0; i < panels.length; i++) {
          var prefix = '/' + panels[i]
          if (path === prefix || path.indexOf(prefix + '/') === 0) {
            role = panels[i]
            break
          }
        }
        if (!role) {
          var auth = path.match(/^\/(login|register)\/([^/]+)/i)
          if (auth && panels.indexOf(auth[2].toLowerCase()) !== -1) {
            role = auth[2].toLowerCase()
          } else if (path === '/admin/login' || path.indexOf('/admin/login/') === 0) {
            role = 'admin'
          } else if (path === '/moderator/login' || path.indexOf('/moderator/login/') === 0) {
            role = 'moderator'
          }
        }
        if (!role) return
        var link = document.createElement('link')
        link.id = 'panel-pwa-manifest'
        link.rel = 'manifest'
        link.href = '/manifests/' + role + '.webmanifest'
        document.head.appendChild(link)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <title>CONSTRUPRECO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
